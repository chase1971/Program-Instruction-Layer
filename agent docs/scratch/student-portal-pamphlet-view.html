<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Portal — Pamphlet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #e2e8f0;
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 16px;
    text-align: center;
  }
  a.back {
    display: inline-block;
    margin-bottom: 16px;
    padding: 12px 18px;
    text-decoration: none;
    color: #1d4ed8;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
  }
  a.back:hover, a.back:focus { background: #f8fafc; outline: 2px solid #2563eb; }
  .frame {
    display: inline-block;
    max-width: min(100%, 680px);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
    overflow: hidden;
  }
  img {
    display: block;
    width: 100%;
    height: auto;
  }
  p.hint {
    margin-top: 14px;
    color: #64748b;
    font-size: 14px;
  }
</style>
</head>
<body>
  <a class="back" href="/pages.html">← All pages</a>
  <div class="frame">
    <img src="/scratch/student-portal-pamphlet.png" alt="Student Portal one-page overview pamphlet" />
  </div>
  <p class="hint">Right-click the image to save or print.</p>
</body>
</html>
