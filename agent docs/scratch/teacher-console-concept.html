grid-template-columns:1fr}.tester{max-width:812px}.portal{min-width:0}}@media(max-width:750px){.shell{display:block}.side{display:flex;gap:8px;flex-wrap:wrap;padding:12px}.side h2,.side p{display:none}.side button{width:auto;margin:0}.side .manage{margin:0}.main,.courses{padding:12px}.section-grid{grid-template-columns:1fr}.portal{aspect-ratio:auto;min-height:420px;padding:15px}.workspace{display:block}.tester{margin-top:15px}}

</style></head><body>
<div id="courses" class="courses row" aria-label="Classes"></div><div class="shell"><aside class="side"><h2>Teacher Console</h2><button data-view="preview">Preview</button><button data-view="students">Students & responses</button><button data-view="testers">Testers</button><button class="manage" data-view="manage">Manage class</button><p>The selected class stays in place while you move between workspaces.</p></aside><main id="main" class="main" aria-live="polite"></main></div>
<script>
const previewPersonas=[{name:'Admin',code:'CHASE1'},{name:'Student tester',code:'TESTER'}];
const demoApps=['Gauss-Jordan Method','Math App Survey','Factoring Practice','Fractions Review','Logic Practice','Probability Lab','Transformations','Statistics Practice','Quadratics','Exam Check-in'];
const studentRows=[['Allen','Deanna','4AX6UT'],['Amaya','Alex','6LZSJT'],['Aragon','Alyssa','5B5DJ8'],['Baines','Timothy','K2YJ52'],['Barrass','William','FPF7DL'],['Clark','Avery','5GXAQU'],['Davis','Gracie','U6NRTP'],['Davis','Riane','EGKLKB'],['Demchenko','Denys','C7S9KL'],['Faria','Viviana','L6DH82'],['Flores','Michael','5JETLB'],['Fugon Guevara','Victor','REBTNP'],['Garcia Baptiste','Maria','6SP6DW'],['Hairston','Kiaya','DMLXBW']];
const studentAccess={};
(()=>{const courses=['MATH-2413 · Online','MATH-2412 · MW 8–10:20','MATH-1324 · TTH 11–12:20','MATH-1314 · TTH 8–9:20'],apps=['Gauss-Jordan Method','Math App Survey'];const state={course:2,view:'preview',app:0,tester:0,portal:-1,panel:'roster',gradePage:0,testerFullPanel:'responses',testerPage:0};const testers=[{name:'Chase (Admin)',code:'CHASE1',on:[true,true],course:'In course',login:'Today, 9:42 AM',progress:[2,2]},{name:'Student Tester',code:'KQRZC6',on:[true,true],course:'In course',login:'Today, 9:35 AM',progress:[3,2]},{name:'Spare 1',code:'88HR4Q',on:[true,true],course:'In course',login:'Today, 9:31 AM',progress:[2,2]},{name:'Spare 2',code:'WTNWHG',on:[true,false],course:'In course',login:'Yesterday, 3:04 PM',progress:[1,0]},{name:'Spare 3',code:'QG6WR7',on:[false,true],course:'Other course',login:'Yesterday, 2:18 PM',progress:[0,2]},{name:'Spare 4',code:'9BCSUL',on:[false,false],course:'Not in course',login:'Never',progress:[0,0]}];const students=['Avery Bennett','Jordan Ellis','Morgan Hayes','Riley Parker','Casey Rivera','Taylor Brooks'];const q=s=>document.querySelector(s),pressed=(label,attrs,on)=>`<button ${attrs} aria-pressed="${on}">${label}</button>`;
function heading(title,desc){return `<div class="heading"><h1>${title}</h1><p class="muted">${courses[state.course]} · ${desc}</p></div>`}function appTabs(){return `<div class="appbar row"><b>App</b>${apps.map((a,i)=>pressed(a,`data-app="${i}"`,state.app===i)).join('')}</div>`}function responseDetail(t){return state.app===0?`<div class="response"><b>Tutorial progress</b>${t.progress[0]} of 3 parts complete</div><div class="response"><b>Q1 · Next row operation</b>${t.progress[0]>0?'R₂ − 2R₁ → R₂ <span class="result">Correct</span>':'No answer recorded'}</div><div class="response"><b>Q2 · Identify the pivot</b>${t.progress[0]>1?'Column 3 <span class="result wrong">Incorrect</span>':'No answer recorded'}</div>`:`<div class="response"><b>Q1 · More practice with</b>${t.progress[1]?'Row operations':'No response recorded'}</div><div class="response"><b>Q2 · What would make this easier?</b>${t.progress[1]?'“Show an example beside each step.”':'No response recorded'}</div>`}
function testerRoster(){return `<div class="tester-roster"><table class="tester-table"><thead><tr><th>Tester</th><th>Access</th><th>Course</th><th>Actions</th></tr></thead><tbody>${testers.map((t,i)=>`<tr><td class="tester-label"><b>${t.name}</b><br><span class="muted">${t.code}</span></td><td><span class="status ${t.on[state.app]?'':'off'}">${t.on[state.app]?'On':'Off'}</span></td><td>${t.course}</td><td><div class="tester-actions"><button data-reset="${i}" ${t.progress[state.app]?'':'disabled'}>Reset</button><button data-toggle="${i}">${t.on[state.app]?'Deactivate':'Activate'}</button><button data-force="${i}">${t.course==='In course'?'Force link':'Assign'}</button><button data-copy="${i}">Copy</button><button data-rename="${i}">Rename</button></div></td></tr>`).join('')}</tbody></table></div>`}
function testerGrades(){const gauss=[['✓','✓','—','✓','✕','—','—'],['✓','✓','✓','✓','✓','✕','—'],['✓','✓','—','✓','—','—','—'],['✓','—','—','✕','—','—','—'],['—','—','—','—','—','—','—'],['—','—','—','—','—','—','—']],survey=[['Done','Rows','Example'],['Done','Pivots','More hints'],['Done','Steps','Larger text'],['—','—','—'],['Done','Rows','Example'],['—','—','—']];const source=state.app===0?gauss:survey,headers=state.app===0?['Part 1','Part 2','Part 3','Q1','Q2','Q3','Q4']:['Status','Q1 topic','Q2 feedback'];const pageSize=4,maxPage=Math.max(0,Math.ceil(headers.length/pageSize)-1),start=state.gradePage*pageSize,shown=headers.slice(start,start+pageSize);if(state.gradePage>maxPage)state.gradePage=maxPage;return `<div class="mini-grid"><table><thead><tr><th>Tester</th>${shown.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${testers.map((t,i)=>`<tr><td><b>${t.name}</b><br><span class="muted">${t.code}</span></td>${source[i].slice(start,start+pageSize).map(v=>`<td class="${v==='✓'||v==='Done'?'cell-good':v==='✕'?'cell-wrong':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="bar grade-pager"><span class="muted">Columns ${start+1}–${Math.min(start+pageSize,headers.length)} of ${headers.length}</span><div class="row"><button data-grade-page="${Math.max(0,state.gradePage-1)}" ${state.gradePage===0?'disabled':''}>← Previous</button><button data-grade-page="${Math.min(maxPage,state.gradePage+1)}" ${state.gradePage===maxPage?'disabled':''}>Next →</button></div></div>`}
function appSwitcher(){return `<div class="app-switcher"><button class="app-step" data-app-step="-1" aria-label="Previous app">←</button><div class="current-app"><small>App ${state.app+1} of ${demoApps.length}</small><b>${demoApps[state.app]}</b></div><button class="app-step" data-app-step="1" aria-label="Next app">→</button><button data-app-menu="true" aria-pressed="${Boolean(state.appMenu)}">${state.appMenu?'Close apps':'Change app'}</button></div>${state.appMenu?`<div class="app-tray">${demoApps.map((a,i)=>pressed(a,`data-app="${i}"`,state.app===i)).join('')}</div>`:''}`}
function testerPanel(){return `<aside class="tester"><div class="tester-top">${appSwitcher()}<div class="bar"><div><h2>Testers</h2><span class="muted">Admin + five shared tester codes</span></div><div class="view-switch row">${pressed('Roster','data-panel="roster"',state.panel==='roster')}${pressed('Grades','data-panel="grades"',state.panel==='grades')}</div></div></div>${state.panel==='roster'?testerRoster():testerGrades()}</aside>`}
function portal(){const persona=previewPersonas[state.persona??0],mode=state.mode??'preview';return `<section><div class="preview-controls"><div class="control-group mode-group">${pressed('Live','data-mode="live"',mode==='live')}${pressed('Preview','data-mode="preview"',mode==='preview')}</div><div class="control-group">${previewPersonas.map((x,i)=>pressed(x.name,`data-persona="${i}"`,(state.persona??0)===i)).join('')}</div><div class="control-group">${pressed('Landscape','data-orientation="landscape"',!state.phone)}${pressed('Portrait','data-orientation="portrait"',Boolean(state.phone))}</div></div><div class="portal ${state.phone?'phone':''}"><div class="bar"><h2>Student Portal <span class="portal-mode ${mode==='live'?'live':''}">${mode==='live'?'Live app':'Preview app'}</span></h2><span>${persona.name}</span></div><small>${courses[state.course]} · ${persona.code}</small>${state.portal<0?`<div class="portal-card"><h3>Welcome to your class</h3><p class="muted">Choose an activity to get started.</p>${apps.map((a,i)=>`<button data-portal="${i}"><b>${a}</b><small>${i===0?'Guided tutorial · 3 parts':'Exit ticket · 2 questions'} &nbsp; →</small></button>`).join('')}</div>`:`<button class="portal-back" data-portal="-1">← Back to portal home</button><div class="portal-card"><h2>${apps[state.portal]}</h2><p>${state.portal===0?'Part 1 · Row operations':'Question 1 · What would you like more practice with?'}</p><div class="answer-box">${state.portal===0?'Use a row operation to eliminate the first entry in row 2.':'Choose a sample response to confirm it appears beside the preview.'}</div><button data-complete="${state.portal}">${state.portal===0?'Complete sample step':'Submit “Row operations”'}</button></div>`}</div><p class="foot">${mode==='live'?'Live uses the currently published student app.':'Preview uses the working version before it is published.'} Identity and shape apply to either mode.</p></section>`}
function preview(){return `<div class="workspace">${portal()}${testerPanel()}</div>`}function fullTesterRoster(){return `<div class="tablewrap"><table><thead><tr><th>Tester</th><th>Code</th><th>App access</th><th>Course</th><th>Last login</th><th>Actions</th></tr></thead><tbody>${testers.map((t,i)=>`<tr><td><b>${t.name}</b></td><td><b style="color:#245add">${t.code}</b></td><td><span class="status ${t.on[state.app]?'':'off'}">${t.on[state.app]?'On':'Off'}</span></td><td>${t.course}</td><td>${t.login}</td><td><div class="student-roster-actions"><button data-reset="${i}" ${t.progress[state.app]?'':'disabled'}>Reset</button><button data-toggle="${i}">${t.on[state.app]?'Deactivate':'Activate'}</button><button data-force="${i}">${t.course==='In course'?'Force link':'Assign'}</button><button data-copy="${i}">Copy</button><button data-rename="${i}">Rename</button></div></td></tr>`).join('')}</tbody></table></div>`}function fullTesterResponses(){const pageSize=6,gauss=['Part 1','Part 2','Part 3','Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9'],generic=['Status','Q1 topic','Q2 feedback','Submitted','Reviewed','Follow-up'],headers=state.app===0?gauss:generic,maxPage=Math.ceil(headers.length/pageSize)-1,page=Math.min(state.testerPage??0,maxPage),start=page*pageSize,shown=headers.slice(start,start+pageSize);state.testerPage=page;const gaussValues=[['✓','✓','—','✓','✕','—','—','—','—','—','—','—'],['✓','✓','✓','✓','✓','✕','—','—','—','—','—','—'],['✓','✓','—','✓','—','—','—','—','—','—','—','—'],['✓','—','—','✕','—','—','—','—','—','—','—','—'],['—','—','—','—','—','—','—','—','—','—','—','—'],['—','—','—','—','—','—','—','—','—','—','—','—']],surveyValues=[['Done','Rows','Example','9:42 AM','Yes','—'],['Done','Pivots','More hints','9:35 AM','Yes','Needed'],['Done','Steps','Larger text','9:31 AM','No','—'],['—','—','—','—','No','—'],['Done','Rows','Example','Yesterday','Yes','—'],['—','—','—','—','No','—']],values=state.app===0?gaussValues:surveyValues;return `<div class="report-shell"><div class="report-arrows"><button data-tester-page="${Math.max(0,page-1)}" ${page===0?'disabled':''}>←</button><button data-tester-page="${Math.min(maxPage,page+1)}" ${page===maxPage?'disabled':''}>→</button><button class="up" disabled>↑</button><button class="down" disabled>↓</button></div><div class="tablewrap"><table class="student-grid"><thead><tr><th>Tester</th><th>Code</th>${shown.map(h=>`<th><button data-tester-question="${h}">${h}</button></th>`).join('')}</tr></thead><tbody>${testers.map((t,i)=>`<tr><td class="person">${t.name}</td><td class="person">${t.code}</td>${values[i].slice(start,start+pageSize).map((v,j)=>`<td><button class="name ${v==='✓'||v==='Done'?'cell-good':v==='✕'?'cell-wrong':''}" data-tester-cell="${i}|${shown[j]}|${v}">${v}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="bar foot"><span>Showing ${shown[0]}–${shown[shown.length-1]} · ${headers.length} response columns</span><button>Refresh responses</button></div>${state.testerDetail?`<div class="student-detail"><b>${state.testerDetail}</b><p class="muted">Selected tester response appears here without leaving the grid.</p></div>`:''}`}function fullTesters(){const panel=state.testerFullPanel??'responses';return `<button class="back" data-view="preview">← Back to preview</button><div class="student-head"><div>${appSwitcher()}</div><div class="student-view-toggle row">${pressed('Roster','data-tester-panel="roster"',panel==='roster')}${pressed('Responses','data-tester-panel="responses"',panel==='responses')}</div></div>${panel==='roster'?fullTesterRoster():fullTesterResponses()}`}
function studentRoster(){return `<div class="tablewrap"><table><thead><tr><th>Last</th><th>First</th><th>Code</th><th>App access</th><th>Actions</th></tr></thead><tbody>${studentRows.map((s,i)=>{const on=studentAccess[i]??i!==2;return `<tr><td>${s[0]}</td><td>${s[1]}</td><td><b style="color:#245add">${s[2]}</b></td><td><span class="status ${on?'':'off'}">${on?'On':'Off'}</span></td><td><div class="student-roster-actions"><button ${on?'':'disabled'}>Reset</button><button data-student-toggle="${i}">${on?'Deactivate':'Activate'}</button><button>Force link</button><button>Copy</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function studentResponseGrid(){const pageSize=6,gauss=['Part 1','Part 2','Part 3','Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9'],generic=['Step 1','Step 2','Step 3','Check 1','Check 2','Check 3','Check 4','Score'],headers=state.app===0?gauss:generic,maxPage=Math.ceil(headers.length/pageSize)-1,page=Math.min(state.studentPage??0,maxPage),start=page*pageSize,shown=headers.slice(start,start+pageSize);state.studentPage=page;const cell=(i,j)=>{if((i+j)%7===0)return '✕';if((i*2+j)%4===0)return '✓';return '—'};return `<div class="report-shell"><div class="report-arrows"><button data-student-page="${Math.max(0,page-1)}" ${page===0?'disabled':''}>←</button><button data-student-page="${Math.min(maxPage,page+1)}" ${page===maxPage?'disabled':''}>→</button><button class="up" disabled>↑</button><button class="down" disabled>↓</button></div><div class="tablewrap"><table class="student-grid"><thead><tr><th>Last Name</th><th>First Name</th>${shown.map(h=>`<th><button data-question="${h}">${h}</button></th>`).join('')}</tr></thead><tbody>${studentRows.map((s,i)=>`<tr><td class="person">${s[0]}</td><td class="person">${s[1]}</td>${shown.map((h,j)=>{const v=cell(i,start+j);return `<td><button class="name ${v==='✓'?'cell-good':v==='✕'?'cell-wrong':''}" data-student-cell="${i}|${h}|${v}">${v}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div><div class="bar foot"><span>Showing ${shown[0]}–${shown[shown.length-1]} · ${headers.length} result columns</span><button>Refresh responses</button></div>${state.studentDetail?`<div class="student-detail"><b>${state.studentDetail}</b><p class="muted">Selected response detail appears here without leaving the grid.</p></div>`:''}`}
function surveyResponses(){return `<div class="survey-layout"><div class="tablewrap"><table class="student-grid"><thead><tr><th>Last Name</th><th>First Name</th><th>Q1</th><th>Q2</th></tr></thead><tbody>${studentRows.map((s,i)=>`<tr><td class="person">${s[0]}</td><td class="person">${s[1]}</td><td><button class="name" data-student-cell="${i}|Q1|${i%3?'Row operations':'—'}">${i%3?'Row operations':'—'}</button></td><td><button class="name" data-student-cell="${i}|Q2|${i%3?'More examples':'—'}">${i%3?'More examples':'—'}</button></td></tr>`).join('')}</tbody></table></div><aside class="survey-summary"><h3>Response summary</h3><div class="response"><b>Completed</b>9 of 14 students</div><div class="response"><b>Q1 · top response</b>Row operations · 5</div><div class="response"><b>Q2 · common request</b>More examples · 4</div><button>Refresh responses</button></aside></div>${state.studentDetail?`<div class="student-detail"><b>${state.studentDetail}</b><p class="muted">Selected answer shown in full.</p></div>`:''}`}
function studentView(){const panel=state.studentPanel??'responses';return `<button class="back" data-view="preview">← Back to preview</button><div class="student-head"><div>${appSwitcher()}</div><div class="student-view-toggle row">${pressed('Roster','data-student-panel="roster"',panel==='roster')}${pressed('Responses','data-student-panel="responses"',panel==='responses')}</div></div>${panel==='roster'?studentRoster():state.app===1?surveyResponses():studentResponseGrid()}`}
function manage(){return `<button class="back" data-view="preview">← Back to preview</button>`+heading('Manage class','occasional setup away from the daily view')+`<div class="section-grid"><section class="section"><h2>Apps & exit tickets</h2><p>Create, configure, publish, and arrange class activities.</p><button>Manage activities</button></section><section class="section"><h2>Announcements</h2><p>Post and edit messages shown on the portal home screen.</p><button>Manage announcements</button></section><section class="section"><h2>Roster setup</h2><p>Import students, copy portal links, and prepare email drafts.</p><button data-view="students">Open roster</button></section><section class="section"><h2>Login history</h2><p>Review detailed sign-in activity for this class.</p><button>View login history</button></section></div>`}
function render(){q('#courses').innerHTML=courses.map((c,i)=>pressed(c,`data-course="${i}"`,state.course===i)).join('');document.querySelectorAll('.side [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));q('#main').innerHTML=state.view==='preview'?preview():state.view==='testers'?fullTesters():state.view==='students'?studentView():manage()}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.course!==undefined){state.course=+d.course;state.portal=-1}if(d.view)state.view=d.view;if(d.app!==undefined){state.app=+d.app;state.gradePage=0;state.studentPage=0;state.testerPage=0;state.appMenu=false}if(d.appStep!==undefined){state.app=(state.app+Number(d.appStep)+demoApps.length)%demoApps.length;state.gradePage=0;state.studentPage=0;state.testerPage=0}if(d.appMenu)state.appMenu=!state.appMenu;if(d.panel)state.panel=d.panel;if(d.studentPanel)state.studentPanel=d.studentPanel;if(d.testerPanel)state.testerFullPanel=d.testerPanel;if(d.studentPage!==undefined)state.studentPage=+d.studentPage;if(d.testerPage!==undefined)state.testerPage=+d.testerPage;if(d.studentToggle!==undefined)studentAccess[+d.studentToggle]=!(studentAccess[+d.studentToggle]??(+d.studentToggle!==2));if(d.studentCell){const [i,col,value]=d.studentCell.split('|');state.studentDetail=`${studentRows[+i][1]} ${studentRows[+i][0]} · ${col}: ${value}`}if(d.testerCell){const [i,col,value]=d.testerCell.split('|');state.testerDetail=`${testers[+i].name} · ${col}: ${value}`}if(d.question)state.studentDetail=`${d.question} · question details`;if(d.testerQuestion)state.testerDetail=`${d.testerQuestion} · tester response details`;if(d.gradePage!==undefined)state.gradePage=+d.gradePage;if(d.tester!==undefined)state.tester=+d.tester;if(d.mode)state.mode=d.mode;if(d.persona!==undefined)state.persona=+d.persona;if(d.orientation)state.phone=d.orientation==='portrait';if(d.portal!==undefined)state.portal=+d.portal;if(d.toggle!==undefined){const t=testers[+d.toggle];t.on[state.app]=!t.on[state.app]}if(d.reset!==undefined)testers[+d.reset].progress[state.app]=0;if(d.force!==undefined)testers[+d.force].course='In course';if(d.complete!==undefined){state.app=+d.complete;testers[0].progress[state.app]=state.app===0?Math.min(3,testers[0].progress[0]+1):2;testers[0].login='Today, just now';state.portal=-1}render()});render()})();
</script></body></html>
