<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Console dashboard layout probe</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f2744; }
    .banner { background: #fef3c7; padding: 0.5rem 1rem; font-size: 13px; }
    .screen { padding: 1rem 1.25rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 0.75rem 1.25rem; align-items: start; width: 100%; }
    .sidebar { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 0.75rem; min-width: 0; }
    .span-full { grid-column: 1 / -1; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 0.85rem; font-size: 12px; }
    .card h3 { margin: 0 0 0.35rem; font-size: 14px; }
    .preview-col { }
    .phone {
      border: 2px solid #2563eb;
      background: #eff6ff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #2563eb;
      box-shadow: 0 2px 8px rgba(15,39,68,0.12);
    }
    .phone--portrait { width: 460px; height: 812px; }
    .phone--landscape { width: 812px; height: 460px; }
    .toggle { margin: 1rem 0; display: flex; gap: 0.5rem; }
    button { min-height: 2.5rem; padding: 0 1rem; font: inherit; cursor: pointer; }
    button.active { background: #2563eb; color: #fff; border: 1px solid #2563eb; }
  </style>
</head>
<body>
  <p class="banner">Layout probe — 2026-09-12. Box sizes match launcher chromeWindow (460×812 / 812×460). Not the live Electron app.</p>
  <div class="screen">
    <h1 style="margin:0 0 0.25rem;font-size:1.35rem">Dashboard</h1>
    <p style="margin:0 0 0.75rem;color:#64748b;font-size:14px">MATH-1324 sample course</p>
    <div class="toggle">
      <button id="btn-portrait" class="active" type="button">Portrait 460×812</button>
      <button id="btn-landscape" type="button">Landscape 812×460</button>
    </div>
    <div class="layout">
      <div class="sidebar">
        <div class="card"><h3>Apps</h3>Gauss-Jordan + add tile</div>
        <div class="card"><h3>Exit Tickets</h3>Tech Check + create</div>
        <div class="card span-full"><h3>Announcements</h3>Welcome message</div>
        <div class="card span-full"><h3>Logins</h3>Week sparkline</div>
      </div>
      <div class="preview-col">
        <div id="phone" class="phone phone--portrait">460 × 812</div>
      </div>
    </div>
  </div>
  <script>
    const phone = document.getElementById('phone');
    const btnP = document.getElementById('btn-portrait');
    const btnL = document.getElementById('btn-landscape');
    function setMode(mode) {
      const landscape = mode === 'landscape';
      phone.className = 'phone ' + (landscape ? 'phone--landscape' : 'phone--portrait');
      phone.textContent = landscape ? '812 × 460' : '460 × 812';
      btnP.classList.toggle('active', !landscape);
      btnL.classList.toggle('active', landscape);
    }
    btnP.onclick = () => setMode('portrait');
    btnL.onclick = () => setMode('landscape');
  </script>
</body>
</html>
