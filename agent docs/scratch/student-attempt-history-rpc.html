<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Attempt History RPC — Supabase</title>
<style>
  body { font: 18px/1.6 system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 20px 80px; }
  .btn { display: block; width: 100%; margin: 20px 0; padding: 24px; background: #1d4ed8; color: #fff; border: none; border-radius: 14px; font: 600 20px system-ui, sans-serif; cursor: pointer; }
  .btn.done { background: #15803d; }
  code { background: #e2e8f0; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Student portal — list_student_attempts RPC</h1>
  <p>Paste this once in the Supabase SQL editor and run it. After that, the <strong>Grades</strong> tab in the portal can show each student's attempt history.</p>
  <button class="btn" id="copyBtn" type="button">Copy SQL to my clipboard</button>
  <p>Open <a href="https://supabase.com/dashboard/project/xdpegfmsauxwspswlmmj/sql/new" target="_blank" rel="noopener">Supabase SQL editor</a>, paste, click Run.</p>
<script>
const SQL = String.raw`create or replace function list_student_attempts(p_student_id uuid)
returns table (
  attempt_id uuid,
  activity_id text,
  activity_title text,
  score numeric,
  max_score numeric,
  status text,
  started_at timestamptz,
  completed_at timestamptz,
  items jsonb
)
language sql
security definer
set search_path = public
as $$
  select
    a.id,
    a.activity_id,
    act.title,
    a.score,
    a.max_score,
    a.status,
    a.started_at,
    a.completed_at,
    coalesce(
      (
        select jsonb_agg(
          jsonb_build_object('slot', i.slot, 'outcome', i.outcome)
          order by i.slot
        )
        from attempt_items i
        where i.attempt_id = a.id
      ),
      '[]'::jsonb
    )
  from attempts a
  join activities act on act.id = a.activity_id
  where a.student_id = p_student_id
  order by a.started_at asc;
$$;

revoke all on function list_student_attempts(uuid) from public;
grant execute on function list_student_attempts(uuid) to anon;`;

document.getElementById('copyBtn').addEventListener('click', function () {
  const done = function () {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied — paste in Supabase SQL editor';
    btn.classList.add('done');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(SQL).then(done);
  }
});
</script>
</body>
</html>
